name: Publish FTDW v1.3.4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v1.3.4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download tested signed APK artifact
        run: |
          curl -L --fail --retry 3 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5904-8211-9ea6-9ea9c89a87de/raw?se=2026-10-02T13%3A48%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=58d7701f-0a6f-574c-b14d-38bec857bdc8&skoid=6fa9748a-b7b2-4b56-a932-8c1417549c47&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A27%3A18Z&ske=2026-10-03T02%3A27%3A18Z&sks=b&skv=2026-02-06&sig=C9bAj6J43gi6fZC0oQ1/lRtHMLK7OW1jLdikQNCZs/c%3D' -o artifact.zip
          mkdir -p out
          unzip -o artifact.zip -d out
          APK_PATH="$(find out -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" FTDW-1.3.4.apk
          sha256sum FTDW-1.3.4.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.4 --repo "mcmollik1-rgb/FDW-Downloads" >/dev/null 2>&1; then
            echo "Release v1.3.4 already exists."
            exit 1
          fi
          gh release create v1.3.4 FTDW-1.3.4.apk \
            --repo "mcmollik1-rgb/FDW-Downloads" \
            --title "FTDW v1.3.4" \
            --notes "FTDW v1.3.4 — Admin-editable persistent top announcement ticker with Bangla, English and emoji-safe rendering."
